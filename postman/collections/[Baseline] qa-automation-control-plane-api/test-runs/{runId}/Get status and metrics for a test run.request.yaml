type: http
name: Get status and metrics for a test run
url: '{{baseUrl}}/test-runs/:runId'
method: GET
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: runId
    value: b7583f4f-f608-7f2c-f0f9-6d939297657f
examples:
  - response:
      statusCode: 200
      statusText: OK
      body:
        type: json
        content: |-
          {
            "runId": "4da15a6d-215c-bf7e-fa88-12772436e82d",
            "suiteId": "0aeed215-5547-7907-dd92-1229cfd89698",
            "status": "queued",
            "environment": "string",
            "releaseVersion": "string",
            "startedAt": "1993-09-28T23:09:03.976Z",
            "finishedAt": "2013-02-07T08:32:54.082Z",
            "passedCount": 36,
            "failedCount": 2416,
            "flakyCount": 1084
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Test run details
  - response:
      statusCode: 404
      statusText: Not Found
      body:
        type: json
        content: |-
          {
            "error": "string",
            "message": "string",
            "statusCode": 1788
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Test run not found
