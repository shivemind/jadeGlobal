type: http
name: Trigger an automation run for a given suite and environment
url: '{{baseUrl}}/test-runs'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "suiteId": "ecf75cd1-686c-35a5-4844-5e879d265410",
      "environment": "preprod",
      "releaseVersion": "string",
      "triggeredBy": "string",
      "runMode": "regression"
    }
examples:
  - response:
      statusCode: 201
      statusText: Created
      body:
        type: json
        content: |-
          {
            "runId": "4da15a6d-215c-bf7e-fa88-12772436e82d",
            "suiteId": "0aeed215-5547-7907-dd92-1229cfd89698",
            "status": "queued",
            "environment": "string",
            "releaseVersion": "string",
            "startedAt": "1993-09-28T23:09:03.976Z",
            "finishedAt": "2013-02-07T08:32:54.082Z",
            "passedCount": 36,
            "failedCount": 2416,
            "flakyCount": 1084
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Test run started
