type: http
name: List accounts
url: '{{baseUrl}}/accounts'
method: GET
headers:
  - key: traceparent
    value: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
    description: W3C Trace Context header for distributed tracing. Format `00-<32-hex-trace-id>-<16-hex-span-id>-01`.
  - key: Accept
    value: application/json
examples:
  - response:
      statusCode: 200
      statusText: OK
      body:
        type: json
        content: |-
          [
            {
              "id": "string",
              "name": "string",
              "type": "investment",
              "balance": 1113.7908509341355,
              "currency": "string",
              "status": "closed",
              "createdAt": "1993-04-14T13:13:52.851Z"
            },
            {
              "id": "string",
              "name": "string",
              "type": "savings",
              "balance": 8538.301492338725,
              "currency": "string",
              "status": "closed",
              "createdAt": "2017-04-21T00:48:01.435Z"
            }
          ]
      headers:
        - key: Content-Type
          value: application/json
        - key: traceparent
          value: ''
          disabled: false
    name: OK
