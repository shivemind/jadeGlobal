type: http
name: List accounts
url: '{{baseUrl}}/accounts'
method: GET
headers:
  - key: traceparent
    value: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
    description: W3C Trace Context header for distributed tracing. Format `00-<32-hex-trace-id>-<16-hex-span-id>-01`.
  - key: Accept
    value: application/json
examples:
  - response:
      statusCode: 200
      statusText: OK
      body:
        type: json
        content: |-
          [
            {
              "id": "string",
              "name": "string",
              "type": "savings",
              "balance": 6854.3321574268875,
              "currency": "string",
              "status": "active",
              "createdAt": "1968-09-19T12:44:11.214Z"
            },
            {
              "id": "string",
              "name": "string",
              "type": "investment",
              "balance": 3928.703392923727,
              "currency": "string",
              "status": "closed",
              "createdAt": "2023-07-14T06:41:29.841Z"
            }
          ]
      headers:
        - key: Content-Type
          value: application/json
        - key: traceparent
          value: ''
          disabled: false
    name: OK
