type: http
name: List payments
url: '{{baseUrl}}/payments'
method: GET
headers:
  - key: traceparent
    value: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
    description: W3C Trace Context header for distributed tracing. Format `00-<32-hex-trace-id>-<16-hex-span-id>-01`.
  - key: Accept
    value: application/json
examples:
  - response:
      statusCode: 200
      statusText: OK
      body:
        type: json
        content: |-
          [
            {
              "id": "string",
              "amount": 3266.039064308581,
              "currency": "string",
              "status": "pending",
              "createdAt": "1985-03-17T18:04:06.295Z"
            },
            {
              "id": "string",
              "amount": 354.4769970914086,
              "currency": "string",
              "status": "failed",
              "createdAt": "1996-12-07T22:34:09.586Z"
            }
          ]
      headers:
        - key: Content-Type
          value: application/json
        - key: traceparent
          value: ''
          disabled: false
    name: OK
