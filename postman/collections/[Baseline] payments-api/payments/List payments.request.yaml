type: http
name: List payments
url: '{{baseUrl}}/payments'
method: GET
headers:
  - key: traceparent
    value: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
    description: W3C Trace Context header for distributed tracing. Format `00-<32-hex-trace-id>-<16-hex-span-id>-01`.
  - key: Accept
    value: application/json
examples:
  - response:
      statusCode: 200
      statusText: OK
      body:
        type: json
        content: |-
          [
            {
              "id": "string",
              "amount": 440.24058030260437,
              "currency": "string",
              "status": "failed",
              "createdAt": "2017-05-05T18:39:26.032Z"
            },
            {
              "id": "string",
              "amount": 3181.4682935416918,
              "currency": "string",
              "status": "failed",
              "createdAt": "1971-05-27T04:10:18.750Z"
            }
          ]
      headers:
        - key: Content-Type
          value: application/json
        - key: traceparent
          value: ''
          disabled: false
    name: OK
