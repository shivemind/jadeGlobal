type: http
name: Reserve inventory for a confirmed order
url: '{{baseUrl}}/orders/:orderId/reserve-inventory'
method: POST
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: orderId
    value: bcab3b4b-9256-a555-3ebe-ce7900a15fe6
examples:
  - response:
      statusCode: 202
      statusText: Accepted
      body:
        type: json
        content: |-
          {
            "actionId": "250825f0-4cfb-bbc0-1a5a-50ca6cd58847",
            "orderId": "f3528988-00f9-e8c3-df7f-faadb5127b58",
            "status": "queued",
            "message": "string"
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Inventory reservation requested
  - response:
      statusCode: 409
      statusText: Conflict
      body:
        type: json
        content: |-
          {
            "error": "string",
            "message": "string",
            "statusCode": 8681
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Inventory cannot be reserved
