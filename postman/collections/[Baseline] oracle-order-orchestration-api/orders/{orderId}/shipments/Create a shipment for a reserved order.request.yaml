type: http
name: Create a shipment for a reserved order
url: '{{baseUrl}}/orders/:orderId/shipments'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: orderId
    value: bcab3b4b-9256-a555-3ebe-ce7900a15fe6
body:
  type: json
  content: |-
    {
      "carrier": "string",
      "shipFrom": "string",
      "trackingReference": "string"
    }
examples:
  - response:
      statusCode: 201
      statusText: Created
      body:
        type: json
        content: |-
          {
            "shipmentId": "ffb725fc-e300-1aec-0f58-f12dd06a232e",
            "carrier": "string",
            "shipFrom": "string",
            "trackingReference": "string",
            "status": "shipped"
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Shipment created
