type: http
name: Create an ERP order for downstream fulfillment
url: '{{baseUrl}}/orders'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "customerId": "string",
      "orderDate": "2005-11-20",
      "currency": "USD",
      "lineItems": [
        {
          "sku": "string",
          "quantity": 7454,
          "unitPrice": 9810.747548471982,
          "warehouseCode": "string"
        }
      ],
      "sourceSystem": "salesforce"
    }
