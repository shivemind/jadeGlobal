type: http
name: Trigger an automation run for a given suite and environment
url: '{{baseUrl}}/test-runs'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "suiteId": "3b56be99-4a62-5a15-3e4b-7cac3076dde2",
      "environment": "qa",
      "releaseVersion": "string",
      "triggeredBy": "string",
      "runMode": "smoke"
    }
scripts:
  - type: afterResponse
    code:
      - // [Smoke] Auto-generated test assertions
      - pm.test('Status code is successful (2xx)', function () {
      - '    pm.response.to.be.success;'
      - '});'
      - pm.test('Response time is acceptable', function () {
      - '    var threshold = parseInt(pm.environment.get(''RESPONSE_TIME_THRESHOLD'') || ''2000'', 10);'
      - '    pm.expect(pm.response.responseTime).to.be.below(threshold);'
      - '});'
      - pm.test('Response body is not empty', function () {
      - '    if (pm.response.code !== 204) {'
      - '        var body = pm.response.text();'
      - '        pm.expect(body.length).to.be.above(0);'
      - '    }'
      - '});'
    language: text/javascript
examples:
  - response:
      statusCode: 201
      statusText: Created
      body:
        type: json
        content: |-
          {
            "runId": "17fcfcbe-29c2-acba-9ec2-58228e7bd185",
            "suiteId": "9ab27954-062e-1cf3-f596-9080ef386e6f",
            "status": "failed",
            "environment": "string",
            "releaseVersion": "string",
            "startedAt": "1952-07-09T16:02:43.801Z",
            "finishedAt": "1985-02-21T11:17:45.026Z",
            "passedCount": 1304,
            "failedCount": 4827,
            "flakyCount": 6963
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Test run started
