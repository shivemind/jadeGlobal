type: http
name: Capture a new inbound lead
url: '{{baseUrl}}/leads'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "firstName": "string",
      "lastName": "string",
      "email": "HrblQ3L@sLkDXGehavmTVh.fdci",
      "company": "string",
      "source": "webinar",
      "interestArea": "revenue-operations"
    }
examples:
  - response:
      statusCode: 201
      statusText: Created
      body:
        type: json
        content: |-
          {
            "leadId": "42125e90-6a60-41bf-9874-372473877538",
            "status": "new",
            "score": 830,
            "owner": "string"
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Lead created
