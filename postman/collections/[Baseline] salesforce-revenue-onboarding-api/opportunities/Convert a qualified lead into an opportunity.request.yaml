type: http
name: Convert a qualified lead into an opportunity
url: '{{baseUrl}}/opportunities'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "leadId": "35de8ec4-cd3b-bf48-dbb3-936d333964c6",
      "accountName": "string",
      "amount": 537.6394095701075,
      "expectedCloseDate": "1992-05-19",
      "productFamily": "string",
      "billingModel": "hybrid"
    }
examples:
  - response:
      statusCode: 201
      statusText: Created
      body:
        type: json
        content: |-
          {
            "opportunityId": "2b30b759-fd1e-96c7-c216-8f1c667b7e07",
            "accountName": "string",
            "stage": "close_lost",
            "amount": 2885.3345617292534,
            "expectedCloseDate": "1988-02-06"
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Opportunity created
