type: http
name: Get order status and fulfillment details
url: '{{baseUrl}}/orders/:orderId'
method: GET
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: orderId
    value: 7e0f4149-2e77-a975-60ec-bb7199a5b08f
scripts:
  - type: afterResponse
    code:
      - // [Smoke] Auto-generated test assertions
      - pm.test('Status code is successful (2xx)', function () {
      - '    pm.response.to.be.success;'
      - '});'
      - pm.test('Response time is acceptable', function () {
      - '    var threshold = parseInt(pm.environment.get(''RESPONSE_TIME_THRESHOLD'') || ''2000'', 10);'
      - '    pm.expect(pm.response.responseTime).to.be.below(threshold);'
      - '});'
      - pm.test('Response body is not empty', function () {
      - '    if (pm.response.code !== 204) {'
      - '        var body = pm.response.text();'
      - '        pm.expect(body.length).to.be.above(0);'
      - '    }'
      - '});'
    language: text/javascript
examples:
  - response:
      statusCode: 200
      statusText: OK
      body:
        type: json
        content: |-
          {
            "id": "7fe00946-4d26-94ee-a799-81b7831138b5",
            "customerId": "string",
            "sourceSystem": "string",
            "orderDate": "2016-04-17",
            "currency": "string",
            "status": "confirmed",
            "totalAmount": 3167.3885578997483,
            "lineItems": [
              {
                "sku": "string",
                "quantity": 5470,
                "unitPrice": 6832.365843760073,
                "warehouseCode": "string"
              },
              {
                "sku": "string",
                "quantity": 4818,
                "unitPrice": 2478.546686110106,
                "warehouseCode": "string"
              }
            ],
            "shipments": [
              {
                "shipmentId": "22f006ee-6205-ec76-bab8-ef2fe2bbc4ab",
                "carrier": "string",
                "shipFrom": "string",
                "trackingReference": "string",
                "status": "delivered"
              },
              {
                "shipmentId": "4d71779b-ce12-b64f-735a-0fbe987206fe",
                "carrier": "string",
                "shipFrom": "string",
                "trackingReference": "string",
                "status": "delivered"
              }
            ]
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Order details
  - response:
      statusCode: 404
      statusText: Not Found
      body:
        type: json
        content: |-
          {
            "error": "string",
            "message": "string",
            "statusCode": 4275
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Order not found
