type: http
name: Request downstream app access for a worker
url: '{{baseUrl}}/workers/:workerId/access-requests'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: workerId
    value: 25def65d-6fa3-2657-ed92-68a98551e98e
body:
  type: json
  content: |-
    {
      "systemName": "salesforce",
      "roleName": "string",
      "justification": "string",
      "requestedBy": "string"
    }
examples:
  - response:
      statusCode: 201
      statusText: Created
      body:
        type: json
        content: |-
          {
            "ticketId": "cdd5a65a-4570-2b49-2692-65c99502ebb3",
            "workerId": "53271a4e-306a-5025-702d-e49459d6e2de",
            "systemName": "string",
            "status": "failed"
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Access request created
