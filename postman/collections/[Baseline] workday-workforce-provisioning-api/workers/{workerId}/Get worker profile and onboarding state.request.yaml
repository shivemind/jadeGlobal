type: http
name: Get worker profile and onboarding state
url: '{{baseUrl}}/workers/:workerId'
method: GET
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: workerId
    value: 25def65d-6fa3-2657-ed92-68a98551e98e
examples:
  - response:
      statusCode: 200
      statusText: OK
      body:
        type: json
        content: |-
          {
            "workerId": "4c8f505d-9e7e-0886-d633-64e18ab2835d",
            "employeeNumber": "string",
            "status": "leave",
            "department": "string",
            "location": "string",
            "startDate": "1971-05-25",
            "onboardingState": "blocked"
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Worker details
