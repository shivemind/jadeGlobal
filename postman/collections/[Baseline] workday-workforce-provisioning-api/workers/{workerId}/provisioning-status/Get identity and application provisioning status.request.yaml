type: http
name: Get identity and application provisioning status
url: '{{baseUrl}}/workers/:workerId/provisioning-status'
method: GET
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: workerId
    value: 25def65d-6fa3-2657-ed92-68a98551e98e
examples:
  - response:
      statusCode: 200
      statusText: OK
      body:
        type: json
        content: |-
          {
            "workerId": "66cf4578-bb88-988e-2986-0e9dfac2c9c9",
            "identityStatus": "failed",
            "laptopStatus": "failed",
            "applicationAccess": [
              {
                "systemName": "string",
                "status": "failed"
              },
              {
                "systemName": "string",
                "status": "not_started"
              }
            ]
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Provisioning state
