type: http
name: Create a worker profile and initiate onboarding
url: '{{baseUrl}}/workers'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "firstName": "string",
      "lastName": "string",
      "workEmail": "O-r@bPaQgY.lhc",
      "department": "string",
      "startDate": "1988-04-15",
      "managerId": "string",
      "location": "string",
      "employmentType": "contractor"
    }
examples:
  - response:
      statusCode: 201
      statusText: Created
      body:
        type: json
        content: |-
          {
            "workerId": "4c8f505d-9e7e-0886-d633-64e18ab2835d",
            "employeeNumber": "string",
            "status": "leave",
            "department": "string",
            "location": "string",
            "startDate": "1971-05-25",
            "onboardingState": "blocked"
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Worker created
