name: service-account-full-pipeline

on:
  push:
    branches:
      - dan/service-account-auth-wargames
  workflow_dispatch:
    inputs:
      target_service:
        description: "service_key to process with the Winter Trinity service account"
        required: true
        default: payments-api
        type: string

permissions:
  contents: read
  actions: read

env:
  MANIFEST_PATH: postman-services.json
  REPORTS_DIR: reports
  POSTMAN_INTEGRATION_BACKEND: bifrost

jobs:
  service-account-full-pipeline:
    name: Service-account full pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: select
        name: Select service
        shell: bash
        run: |
          set -euo pipefail
          target_service="${{ github.event_name == 'workflow_dispatch' && inputs.target_service || 'payments-api' }}"
          service="$(jq -c --arg key "${target_service}" '.services[] | select(.service_key == $key)' "${MANIFEST_PATH}")"
          test -n "${service}"
          echo "service=${service}" >> "${GITHUB_OUTPUT}"
          echo "environment_uids_json=$(jq -c '.environment_uids // {}' <<<"${service}")" >> "${GITHUB_OUTPUT}"
          echo "environments_json=$(jq -c '.environments // []' <<<"${service}")" >> "${GITHUB_OUTPUT}"
          echo "runtime_urls_json=$(jq -c '.runtime_urls // {}' <<<"${service}")" >> "${GITHUB_OUTPUT}"
          echo "Selected $(jq -r '.service_key' <<<"${service}")"

      - id: postman_auth
        name: Resolve Winter Trinity service-account token
        uses: shivemind/postman-resolve-service-token-action@dan/validate-cse-pipeline-integration
        with:
          postman-api-key: ${{ secrets.POSTMAN_SERVICE_ACCOUNT_API_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Postman CLI
        run: npm install -g postman-cli

      - name: Authenticate Postman CLI with service-account API key
        shell: bash
        env:
          POSTMAN_SERVICE_ACCOUNT_API_KEY: ${{ secrets.POSTMAN_SERVICE_ACCOUNT_API_KEY }}
        run: |
          set -euo pipefail
          echo "::add-mask::${POSTMAN_SERVICE_ACCOUNT_API_KEY}"
          postman login --with-api-key "${POSTMAN_SERVICE_ACCOUNT_API_KEY}"

      - name: Prepare reports directory
        run: mkdir -p "${REPORTS_DIR}"

      - name: Isolate workspace per service
        run: rm -rf .postman/resources.yaml postman/

      - id: bootstrap
        name: Bootstrap workspace, spec, and collections with service account
        uses: postman-cs/postman-bootstrap-action@v0
        env:
          POSTMAN_TEAM_ID: ${{ steps.postman_auth.outputs.team-id }}
        with:
          project-name: ${{ fromJSON(steps.select.outputs.service).service_key }}
          domain: ${{ fromJSON(steps.select.outputs.service).domain }}
          domain-code: ${{ fromJSON(steps.select.outputs.service).domain_code }}
          requester-email: ${{ fromJSON(steps.select.outputs.service).requester_email }}
          workspace-admin-user-ids: ${{ vars.POSTMAN_WORKSPACE_ADMIN_USER_IDS }}
          spec-url: ${{ fromJSON(steps.select.outputs.service).spec_url }}
          workspace-id: ${{ fromJSON(steps.select.outputs.service).workspace_id }}
          spec-id: ${{ fromJSON(steps.select.outputs.service).spec_id }}
          baseline-collection-id: ${{ fromJSON(steps.select.outputs.service).baseline_collection_id }}
          smoke-collection-id: ${{ fromJSON(steps.select.outputs.service).smoke_collection_id }}
          contract-collection-id: ${{ fromJSON(steps.select.outputs.service).contract_collection_id }}
          collection-sync-mode: reuse
          integration-backend: ${{ env.POSTMAN_INTEGRATION_BACKEND }}
          postman-api-key: ${{ secrets.POSTMAN_SERVICE_ACCOUNT_API_KEY }}
          postman-access-token: ${{ steps.postman_auth.outputs.access-token }}

      - name: Lint OpenAPI spec
        shell: bash
        run: |
          set -o pipefail
          postman spec lint "${{ fromJSON(steps.select.outputs.service).spec_path }}" \
            --fail-severity ERROR \
            --output JSON \
            2>&1 | tee "${REPORTS_DIR}/${{ fromJSON(steps.select.outputs.service).service_key }}-lint.txt"

      - id: smoke
        name: Run smoke tests
        continue-on-error: true
        shell: bash
        env:
          COLLECTION_ID: ${{ fromJSON(steps.select.outputs.service).smoke_collection_id }}
          BOOTSTRAP_COLLECTION_ID: ${{ steps.bootstrap.outputs.smoke-collection-id }}
          BASE_URL: ${{ fromJSON(steps.select.outputs.service).smoke_base_url }}
          API_VERSION: ${{ fromJSON(steps.select.outputs.service).version }}
          SERVICE_KEY: ${{ fromJSON(steps.select.outputs.service).service_key }}
        run: |
          set -o pipefail
          collection_id="${COLLECTION_ID:-${BOOTSTRAP_COLLECTION_ID}}"
          postman collection run "${collection_id}" \
            --env-var "baseUrl=${BASE_URL}" \
            --env-var "apiVersion=${API_VERSION}" \
            --bail failure \
            --report-events \
            --reporters cli,junit,json \
            --reporter-junit-export "${REPORTS_DIR}/${SERVICE_KEY}-smoke.junit.xml" \
            --reporter-json-export "${REPORTS_DIR}/${SERVICE_KEY}-smoke.json" \
            2>&1 | tee "${REPORTS_DIR}/${SERVICE_KEY}-smoke.txt"

      - id: contract
        name: Run contract tests
        continue-on-error: true
        shell: bash
        env:
          COLLECTION_ID: ${{ fromJSON(steps.select.outputs.service).contract_collection_id }}
          BOOTSTRAP_COLLECTION_ID: ${{ steps.bootstrap.outputs.contract-collection-id }}
          BASE_URL: ${{ fromJSON(steps.select.outputs.service).smoke_base_url }}
          API_VERSION: ${{ fromJSON(steps.select.outputs.service).version }}
          SERVICE_KEY: ${{ fromJSON(steps.select.outputs.service).service_key }}
        run: |
          set -o pipefail
          collection_id="${COLLECTION_ID:-${BOOTSTRAP_COLLECTION_ID}}"
          postman collection run "${collection_id}" \
            --env-var "baseUrl=${BASE_URL}" \
            --env-var "apiVersion=${API_VERSION}" \
            --bail failure \
            --report-events \
            --reporters cli,junit,json \
            --reporter-junit-export "${REPORTS_DIR}/${SERVICE_KEY}-contract.junit.xml" \
            --reporter-json-export "${REPORTS_DIR}/${SERVICE_KEY}-contract.json" \
            2>&1 | tee "${REPORTS_DIR}/${SERVICE_KEY}-contract.txt"

      - id: repo_sync
        name: Repo sync and API catalog integration with service account
        uses: postman-cs/postman-repo-sync-action@v0
        env:
          POSTMAN_TEAM_ID: ${{ steps.postman_auth.outputs.team-id }}
        with:
          project-name: ${{ fromJSON(steps.select.outputs.service).service_key }}
          workspace-id: ${{ steps.bootstrap.outputs.workspace-id }}
          spec-id: ${{ steps.bootstrap.outputs.spec-id }}
          baseline-collection-id: ${{ steps.bootstrap.outputs.baseline-collection-id }}
          smoke-collection-id: ${{ steps.bootstrap.outputs.smoke-collection-id }}
          contract-collection-id: ${{ steps.bootstrap.outputs.contract-collection-id }}
          spec-path: ${{ fromJSON(steps.select.outputs.service).spec_path }}
          environments-json: ${{ steps.select.outputs.environments_json }}
          environment-uids-json: ${{ steps.select.outputs.environment_uids_json }}
          env-runtime-urls-json: ${{ steps.select.outputs.runtime_urls_json }}
          generate-ci-workflow: false
          integration-backend: ${{ env.POSTMAN_INTEGRATION_BACKEND }}
          repo-write-mode: none
          monitor-type: cli
          postman-api-key: ${{ secrets.POSTMAN_SERVICE_ACCOUNT_API_KEY }}
          postman-access-token: ${{ steps.postman_auth.outputs.access-token }}
          org-mode: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-fallback-token: ${{ secrets.GH_FALLBACK_TOKEN }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-account-full-pipeline-reports-${{ github.event_name == 'workflow_dispatch' && inputs.target_service || 'payments-api' }}
          path: reports/
          if-no-files-found: ignore

      - name: Full pipeline summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Service-account full pipeline"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Target service | \`${{ github.event_name == 'workflow_dispatch' && inputs.target_service || 'payments-api' }}\` |"
            echo "| Auth method | \`${{ steps.postman_auth.outputs.auth-method }}\` |"
            echo "| Team ID resolved | \`${{ steps.postman_auth.outputs.team-id != '' && 'yes' || 'no' }}\` |"
            echo "| Bootstrap | \`${{ steps.bootstrap.outcome }}\` |"
            echo "| Smoke tests | \`${{ steps.smoke.outcome }}\` |"
            echo "| Contract tests | \`${{ steps.contract.outcome }}\` |"
            echo "| Repo sync | \`${{ steps.repo_sync.outcome }}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"
