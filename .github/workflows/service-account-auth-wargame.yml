name: service-account-auth-wargame

on:
  push:
    branches:
      - dan/service-account-auth-wargames
  workflow_dispatch:
    inputs:
      mode:
        description: "Scope to run"
        required: true
        default: auth-only
        type: choice
        options:
          - auth-only
          - downstream-smoke
      target_service:
        description: "Optional service_key for downstream smoke"
        required: false
        type: string
permissions:
  contents: read

env:
  MANIFEST_PATH: postman-services.json

jobs:
  auth-war-game:
    name: Auth war game
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-wargame]')
    runs-on: ubuntu-latest
    outputs:
      team_id: ${{ steps.resolve_service_account.outputs.team-id }}
      auth_method: ${{ steps.resolve_service_account.outputs.auth-method }}
      skipped: ${{ steps.resolve_service_account.outputs.skipped }}
      old_api_key_me_code: ${{ steps.old_api_key_me.outputs.http_code }}
      new_bearer_me_code: ${{ steps.new_bearer_me.outputs.http_code }}
      existing_access_token_result: ${{ steps.existing_access_token.outcome }}
      existing_bearer_me_code: ${{ steps.existing_bearer_me.outputs.http_code }}
      invalid_key_result: ${{ steps.invalid_key.outcome }}
      missing_input_result: ${{ steps.missing_input.outcome }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify required secret names exist at runtime
        shell: bash
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          POSTMAN_SERVICE_ACCOUNT_API_KEY: ${{ secrets.POSTMAN_SERVICE_ACCOUNT_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${POSTMAN_API_KEY}"
          test -n "${POSTMAN_SERVICE_ACCOUNT_API_KEY}"
          echo "::add-mask::${POSTMAN_API_KEY}"
          echo "::add-mask::${POSTMAN_SERVICE_ACCOUNT_API_KEY}"

      - name: Old flow /me with API key
        id: old_api_key_me
        shell: bash
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          set -euo pipefail
          echo "::add-mask::${POSTMAN_API_KEY}"
          result="$(curl -sS -o /tmp/old-me.json -w "%{http_code} %{time_total}" \
            "https://api.getpostman.com/me" \
            -H "x-api-key: ${POSTMAN_API_KEY}")"
          http_code="${result%% *}"
          time_total="${result##* }"
          echo "http_code=${http_code}" >> "${GITHUB_OUTPUT}"
          echo "time_total=${time_total}" >> "${GITHUB_OUTPUT}"
          if [[ ! "${http_code}" =~ ^2[0-9]{2}$ ]]; then
            echo "::warning::Old flow /me failed with HTTP ${http_code}"
            jq '{error, message}' /tmp/old-me.json 2>/dev/null || true
            exit 0
          fi
          echo "Old flow /me succeeded in ${time_total}s"

      - id: existing_access_token
        name: Current access-token passthrough
        continue-on-error: true
        uses: shivemind/postman-resolve-service-token-action@dan/validate-cse-pipeline-integration
        with:
          postman-access-token: ${{ secrets.POSTMAN_ACCESS_TOKEN }}

      - name: Current access token /me with bearer only
        id: existing_bearer_me
        if: steps.existing_access_token.outcome == 'success'
        shell: bash
        env:
          POSTMAN_ACCESS_TOKEN: ${{ secrets.POSTMAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${POSTMAN_ACCESS_TOKEN}"
          echo "::add-mask::${POSTMAN_ACCESS_TOKEN}"
          result="$(curl -sS -o /tmp/existing-token-me.json -w "%{http_code} %{time_total}" \
            "https://api.getpostman.com/me" \
            -H "Authorization: Bearer ${POSTMAN_ACCESS_TOKEN}")"
          http_code="${result%% *}"
          time_total="${result##* }"
          echo "http_code=${http_code}" >> "${GITHUB_OUTPUT}"
          echo "time_total=${time_total}" >> "${GITHUB_OUTPUT}"
          if [[ ! "${http_code}" =~ ^2[0-9]{2}$ ]]; then
            echo "::warning::Current access token /me failed with HTTP ${http_code}"
            jq '{error, message}' /tmp/existing-token-me.json 2>/dev/null || true
            exit 0
          fi
          echo "Current access token /me succeeded in ${time_total}s"

      - id: resolve_service_account
        name: New flow resolve service-account token
        continue-on-error: true
        uses: shivemind/postman-resolve-service-token-action@dan/validate-cse-pipeline-integration
        with:
          postman-api-key: ${{ secrets.POSTMAN_SERVICE_ACCOUNT_API_KEY }}

      - name: New flow /me with resolved bearer token
        id: new_bearer_me
        if: steps.resolve_service_account.outcome == 'success'
        shell: bash
        env:
          POSTMAN_ACCESS_TOKEN: ${{ steps.resolve_service_account.outputs.access-token }}
        run: |
          set -euo pipefail
          test -n "${POSTMAN_ACCESS_TOKEN}"
          echo "::add-mask::${POSTMAN_ACCESS_TOKEN}"
          result="$(curl -sS -o /tmp/new-me.json -w "%{http_code} %{time_total}" \
            "https://api.getpostman.com/me" \
            -H "Authorization: Bearer ${POSTMAN_ACCESS_TOKEN}")"
          http_code="${result%% *}"
          time_total="${result##* }"
          echo "http_code=${http_code}" >> "${GITHUB_OUTPUT}"
          echo "time_total=${time_total}" >> "${GITHUB_OUTPUT}"
          if [[ ! "${http_code}" =~ ^2[0-9]{2}$ ]]; then
            echo "::error::New flow bearer /me failed with HTTP ${http_code}"
            jq '{error, message}' /tmp/new-me.json 2>/dev/null || true
            exit 1
          fi
          echo "New flow bearer /me succeeded in ${time_total}s"

      - id: provided_token
        name: Provided access token passthrough
        if: steps.resolve_service_account.outcome == 'success'
        uses: shivemind/postman-resolve-service-token-action@dan/validate-cse-pipeline-integration
        with:
          postman-access-token: ${{ steps.resolve_service_account.outputs.access-token }}

      - name: Assert passthrough did not mint
        if: steps.resolve_service_account.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.provided_token.outputs.skipped }}" = "true"
          test "${{ steps.provided_token.outputs.auth-method }}" = "provided-access-token"
          test -n "${{ steps.provided_token.outputs.team-id }}"

      - id: invalid_key
        name: Negative test invalid API key
        continue-on-error: true
        uses: shivemind/postman-resolve-service-token-action@dan/validate-cse-pipeline-integration
        with:
          postman-api-key: PMAK-invalid-wargame-key

      - name: Assert invalid API key failed
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.invalid_key.outcome }}" = "failure"

      - id: missing_input
        name: Negative test missing inputs
        continue-on-error: true
        uses: shivemind/postman-resolve-service-token-action@dan/validate-cse-pipeline-integration

      - name: Assert missing inputs failed
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.missing_input.outcome }}" = "failure"

      - name: Evaluate critical outcomes
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.resolve_service_account.outcome }}" = "success"
          test "${{ steps.new_bearer_me.outputs.http_code }}" != ""
          test "${{ steps.new_bearer_me.outputs.http_code }}" -ge 200
          test "${{ steps.new_bearer_me.outputs.http_code }}" -lt 300
          test "${{ steps.invalid_key.outcome }}" = "failure"
          test "${{ steps.missing_input.outcome }}" = "failure"

      - name: War-game summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Service-account auth war game"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Old API-key /me | \`${{ steps.old_api_key_me.outputs.http_code }}\` in \`${{ steps.old_api_key_me.outputs.time_total }}s\` |"
            echo "| Current access-token passthrough | \`${{ steps.existing_access_token.outcome }}\` |"
            echo "| Current bearer /me | \`${{ steps.existing_bearer_me.outputs.http_code }}\` in \`${{ steps.existing_bearer_me.outputs.time_total }}s\` |"
            echo "| New service-account resolver | \`${{ steps.resolve_service_account.outcome }}\` |"
            echo "| New bearer /me | \`${{ steps.new_bearer_me.outputs.http_code }}\` in \`${{ steps.new_bearer_me.outputs.time_total }}s\` |"
            echo "| Team ID resolved | \`${{ steps.resolve_service_account.outputs.team-id != '' && 'yes' || 'no' }}\` |"
            echo "| Access-token passthrough skipped mint | \`${{ steps.provided_token.outputs.skipped }}\` |"
            echo "| Invalid key negative test | \`${{ steps.invalid_key.outcome }}\` |"
            echo "| Missing input negative test | \`${{ steps.missing_input.outcome }}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

  non-service-key-negative-control:
    name: Non-service PMAK negative control
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-wargame]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify non-service API key secret exists
        shell: bash
        env:
          POSTMAN_NON_SERVICE_API_KEY: ${{ secrets.POSTMAN_NON_SERVICE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${POSTMAN_NON_SERVICE_API_KEY}"
          echo "::add-mask::${POSTMAN_NON_SERVICE_API_KEY}"

      - name: Non-service key /me with API key
        id: non_service_me
        shell: bash
        env:
          POSTMAN_NON_SERVICE_API_KEY: ${{ secrets.POSTMAN_NON_SERVICE_API_KEY }}
        run: |
          set -euo pipefail
          echo "::add-mask::${POSTMAN_NON_SERVICE_API_KEY}"
          result="$(curl -sS -o /tmp/non-service-me.json -w "%{http_code} %{time_total}" \
            "https://api.getpostman.com/me" \
            -H "x-api-key: ${POSTMAN_NON_SERVICE_API_KEY}")"
          http_code="${result%% *}"
          time_total="${result##* }"
          echo "http_code=${http_code}" >> "${GITHUB_OUTPUT}"
          echo "time_total=${time_total}" >> "${GITHUB_OUTPUT}"
          if [[ ! "${http_code}" =~ ^2[0-9]{2}$ ]]; then
            echo "::error::Non-service PMAK did not work for baseline /me; HTTP ${http_code}"
            jq '{error, message}' /tmp/non-service-me.json 2>/dev/null || true
            exit 1
          fi
          echo "Non-service PMAK /me succeeded in ${time_total}s"

      - id: non_service_exchange
        name: Non-service key must not mint service token
        continue-on-error: true
        uses: shivemind/postman-resolve-service-token-action@dan/validate-cse-pipeline-integration
        with:
          postman-api-key: ${{ secrets.POSTMAN_NON_SERVICE_API_KEY }}

      - name: Assert non-service key exchange failed
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.non_service_exchange.outcome }}" = "failure"

      - name: Non-service negative-control summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Non-service PMAK negative control"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| API-key /me | \`${{ steps.non_service_me.outputs.http_code }}\` in \`${{ steps.non_service_me.outputs.time_total }}s\` |"
            echo "| Service token exchange | \`${{ steps.non_service_exchange.outcome }}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

  fresh-access-token-control:
    name: Fresh access-token control
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-wargame]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify fresh access token secret exists
        shell: bash
        env:
          POSTMAN_FRESH_ACCESS_TOKEN: ${{ secrets.POSTMAN_FRESH_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${POSTMAN_FRESH_ACCESS_TOKEN}"
          echo "::add-mask::${POSTMAN_FRESH_ACCESS_TOKEN}"

      - id: fresh_token_passthrough
        name: Fresh token passthrough and Team ID resolution
        uses: shivemind/postman-resolve-service-token-action@dan/validate-cse-pipeline-integration
        with:
          postman-access-token: ${{ secrets.POSTMAN_FRESH_ACCESS_TOKEN }}

      - name: Fresh token /me with bearer only
        id: fresh_token_me
        shell: bash
        env:
          POSTMAN_FRESH_ACCESS_TOKEN: ${{ secrets.POSTMAN_FRESH_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::${POSTMAN_FRESH_ACCESS_TOKEN}"
          result="$(curl -sS -o /tmp/fresh-token-me.json -w "%{http_code} %{time_total}" \
            "https://api.getpostman.com/me" \
            -H "Authorization: Bearer ${POSTMAN_FRESH_ACCESS_TOKEN}")"
          http_code="${result%% *}"
          time_total="${result##* }"
          echo "http_code=${http_code}" >> "${GITHUB_OUTPUT}"
          echo "time_total=${time_total}" >> "${GITHUB_OUTPUT}"
          if [[ ! "${http_code}" =~ ^2[0-9]{2}$ ]]; then
            echo "::error::Fresh access token /me failed with HTTP ${http_code}"
            jq '{error, message}' /tmp/fresh-token-me.json 2>/dev/null || true
            exit 1
          fi
          echo "Fresh access token /me succeeded in ${time_total}s"

      - name: Assert fresh token passthrough
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.fresh_token_passthrough.outputs.skipped }}" = "true"
          test "${{ steps.fresh_token_passthrough.outputs.auth-method }}" = "provided-access-token"
          test -n "${{ steps.fresh_token_passthrough.outputs.team-id }}"
          test "${{ steps.fresh_token_me.outputs.http_code }}" -ge 200
          test "${{ steps.fresh_token_me.outputs.http_code }}" -lt 300

      - name: Fresh access-token summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Fresh access-token control"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Passthrough skipped mint | \`${{ steps.fresh_token_passthrough.outputs.skipped }}\` |"
            echo "| Auth method | \`${{ steps.fresh_token_passthrough.outputs.auth-method }}\` |"
            echo "| Team ID resolved | \`${{ steps.fresh_token_passthrough.outputs.team-id != '' && 'yes' || 'no' }}\` |"
            echo "| Bearer /me | \`${{ steps.fresh_token_me.outputs.http_code }}\` in \`${{ steps.fresh_token_me.outputs.time_total }}s\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

  backward-compat-existing-pmak:
    name: Backward compatibility existing PMAK
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-compat]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Existing PMAK still works for direct API-key auth
        id: existing_pmak_me
        shell: bash
        env:
          POSTMAN_NON_SERVICE_API_KEY: ${{ secrets.POSTMAN_NON_SERVICE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${POSTMAN_NON_SERVICE_API_KEY}"
          echo "::add-mask::${POSTMAN_NON_SERVICE_API_KEY}"
          result="$(curl -sS -o /tmp/existing-pmak-me.json -w "%{http_code} %{time_total}" \
            "https://api.getpostman.com/me" \
            -H "x-api-key: ${POSTMAN_NON_SERVICE_API_KEY}")"
          http_code="${result%% *}"
          time_total="${result##* }"
          echo "http_code=${http_code}" >> "${GITHUB_OUTPUT}"
          echo "time_total=${time_total}" >> "${GITHUB_OUTPUT}"
          if [[ ! "${http_code}" =~ ^2[0-9]{2}$ ]]; then
            echo "::error::Existing PMAK flow failed with HTTP ${http_code}"
            jq '{error, message}' /tmp/existing-pmak-me.json 2>/dev/null || true
            exit 1
          fi
          echo "Existing PMAK direct /me succeeded in ${time_total}s"

      - name: Confirm resolver does not silently accept non-service PMAK
        id: non_service_resolver
        continue-on-error: true
        uses: shivemind/postman-resolve-service-token-action@dan/validate-cse-pipeline-integration
        with:
          postman-api-key: ${{ secrets.POSTMAN_NON_SERVICE_API_KEY }}

      - name: Assert backward compatibility posture
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.existing_pmak_me.outputs.http_code }}" -ge 200
          test "${{ steps.existing_pmak_me.outputs.http_code }}" -lt 300
          test "${{ steps.non_service_resolver.outcome }}" = "failure"

      - name: Backward compatibility summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Backward compatibility: existing PMAK"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Direct API-key /me | \`${{ steps.existing_pmak_me.outputs.http_code }}\` in \`${{ steps.existing_pmak_me.outputs.time_total }}s\` |"
            echo "| Resolver with non-service PMAK | \`${{ steps.non_service_resolver.outcome }}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

  bearer-only-team-id-fallback:
    name: Bearer-only Team ID fallback
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-compat]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: mint_service_token
        name: Mint service-account token
        uses: shivemind/postman-resolve-service-token-action@dan/validate-cse-pipeline-integration
        with:
          postman-api-key: ${{ secrets.POSTMAN_SERVICE_ACCOUNT_API_KEY }}

      - id: bearer_only
        name: Resolve Team ID from Bearer token only
        continue-on-error: true
        uses: shivemind/postman-resolve-service-token-action@dan/validate-cse-pipeline-integration
        with:
          postman-access-token: ${{ steps.mint_service_token.outputs.access-token }}

      - name: Probe minted token /me auth variants
        id: token_variant_probe
        if: always() && steps.mint_service_token.outcome == 'success'
        shell: bash
        env:
          POSTMAN_ACCESS_TOKEN: ${{ steps.mint_service_token.outputs.access-token }}
        run: |
          set -euo pipefail
          echo "::add-mask::${POSTMAN_ACCESS_TOKEN}"
          bearer_result="$(curl -sS -o /tmp/me-bearer.json -w "%{http_code} %{time_total}" \
            "https://api.getpostman.com/me" \
            -H "Authorization: Bearer ${POSTMAN_ACCESS_TOKEN}")"
          x_access_result="$(curl -sS -o /tmp/me-x-access-token.json -w "%{http_code} %{time_total}" \
            "https://api.getpostman.com/me" \
            -H "x-access-token: ${POSTMAN_ACCESS_TOKEN}")"
          echo "bearer_http_code=${bearer_result%% *}" >> "${GITHUB_OUTPUT}"
          echo "bearer_time_total=${bearer_result##* }" >> "${GITHUB_OUTPUT}"
          echo "x_access_http_code=${x_access_result%% *}" >> "${GITHUB_OUTPUT}"
          echo "x_access_time_total=${x_access_result##* }" >> "${GITHUB_OUTPUT}"
          echo "Bearer /me HTTP ${bearer_result%% *}; x-access-token /me HTTP ${x_access_result%% *}"

      - name: Assert Bearer-only Team ID fallback
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.bearer_only.outcome }}" = "success"
          test "${{ steps.bearer_only.outputs.skipped }}" = "true"
          test "${{ steps.bearer_only.outputs.auth-method }}" = "provided-access-token"
          test -n "${{ steps.bearer_only.outputs.team-id }}"

      - name: Bearer-only fallback summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Bearer-only Team ID fallback"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Mint outcome | \`${{ steps.mint_service_token.outcome }}\` |"
            echo "| Resolver outcome | \`${{ steps.bearer_only.outcome }}\` |"
            echo "| Skipped mint | \`${{ steps.bearer_only.outputs.skipped }}\` |"
            echo "| Auth method | \`${{ steps.bearer_only.outputs.auth-method }}\` |"
            echo "| Team ID resolved | \`${{ steps.bearer_only.outputs.team-id != '' && 'yes' || 'no' }}\` |"
            echo "| Direct Bearer /me | \`${{ steps.token_variant_probe.outputs.bearer_http_code }}\` in \`${{ steps.token_variant_probe.outputs.bearer_time_total }}s\` |"
            echo "| Direct x-access-token /me | \`${{ steps.token_variant_probe.outputs.x_access_http_code }}\` in \`${{ steps.token_variant_probe.outputs.x_access_time_total }}s\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

  secret-refresh-canary:
    name: Secret refresh canary
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-compat]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: refresh
        name: Write canary repo secrets
        uses: shivemind/postman-resolve-service-token-action@dan/validate-cse-pipeline-integration
        with:
          postman-api-key: ${{ secrets.POSTMAN_SERVICE_ACCOUNT_API_KEY }}
          write-github-secret: "true"
          access-token-secret-name: POSTMAN_WARGAME_REFRESH_TOKEN
          team-id-secret-name: POSTMAN_WARGAME_REFRESH_TEAM_ID
          github-token: ${{ secrets.GH_FALLBACK_TOKEN }}

      - name: Verify canary repo secrets exist
        id: verify_canary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_FALLBACK_TOKEN }}
        run: |
          set -euo pipefail
          gh secret list --repo "${GITHUB_REPOSITORY}" | grep -q '^POSTMAN_WARGAME_REFRESH_TOKEN'
          gh secret list --repo "${GITHUB_REPOSITORY}" | grep -q '^POSTMAN_WARGAME_REFRESH_TEAM_ID'

      - name: Clean up canary repo secrets
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_FALLBACK_TOKEN }}
        run: |
          set -euo pipefail
          gh secret delete POSTMAN_WARGAME_REFRESH_TOKEN --repo "${GITHUB_REPOSITORY}" || true
          gh secret delete POSTMAN_WARGAME_REFRESH_TEAM_ID --repo "${GITHUB_REPOSITORY}" || true

      - name: Secret refresh summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Secret refresh canary"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Refresh action outcome | \`${{ steps.refresh.outcome }}\` |"
            echo "| Verification outcome | \`${{ steps.verify_canary.outcome }}\` |"
            echo "| Canary cleanup | attempted |"
          } >> "${GITHUB_STEP_SUMMARY}"

  downstream-smoke:
    name: Downstream smoke
    needs: auth-war-game
    if: inputs.mode == 'downstream-smoke'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: select
        name: Select service
        shell: bash
        run: |
          set -euo pipefail
          target="${{ inputs.target_service }}"
          if [[ -n "${target}" ]]; then
            service="$(jq -c --arg key "${target}" '.services[] | select(.service_key == $key)' "${MANIFEST_PATH}")"
          else
            service="$(jq -c '.services[0]' "${MANIFEST_PATH}")"
          fi
          test -n "${service}"
          echo "service=${service}" >> "${GITHUB_OUTPUT}"
          echo "Selected $(jq -r '.service_key' <<<"${service}")"

      - id: resolve_service_account
        name: Resolve fresh token for downstream action
        uses: shivemind/postman-resolve-service-token-action@dan/validate-cse-pipeline-integration
        with:
          postman-api-key: ${{ secrets.POSTMAN_SERVICE_ACCOUNT_API_KEY }}

      - name: Downstream bootstrap dry smoke
        uses: postman-cs/postman-bootstrap-action@v0
        with:
          project-name: ${{ fromJSON(steps.select.outputs.service).service_key }}
          domain: ${{ fromJSON(steps.select.outputs.service).domain }}
          domain-code: ${{ fromJSON(steps.select.outputs.service).domain_code }}
          requester-email: ${{ fromJSON(steps.select.outputs.service).requester_email }}
          workspace-admin-user-ids: ${{ vars.POSTMAN_WORKSPACE_ADMIN_USER_IDS }}
