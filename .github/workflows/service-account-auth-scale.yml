name: service-account-auth-scale

on:
  push:
    branches:
      - dan/service-account-auth-wargames
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scale-gate:
    name: Scale gate
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-scale]')
    runs-on: ubuntu-latest
    outputs:
      should_run: "true"
    steps:
      - name: Announce scale test
        run: |
          echo "Running controlled auth scale test with capped parallelism."

  service-account-scale:
    name: Service-account resolver scale ${{ matrix.iteration }}
    needs: scale-gate
    if: needs.scale-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        iteration: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        name: Resolve service-account token
        continue-on-error: true
        uses: shivemind/postman-resolve-service-token-action@dan/validate-cse-pipeline-integration
        with:
          postman-api-key: ${{ secrets.POSTMAN_API_KEY }}

      - name: Probe resolved token when available
        id: bearer_me
        if: steps.resolve.outcome == 'success'
        shell: bash
        env:
          POSTMAN_ACCESS_TOKEN: ${{ steps.resolve.outputs.access-token }}
        run: |
          set -euo pipefail
          echo "::add-mask::${POSTMAN_ACCESS_TOKEN}"
          result="$(curl -sS -o /tmp/bearer-me.json -w "%{http_code} %{time_total}" \
            "https://api.getpostman.com/me" \
            -H "Authorization: Bearer ${POSTMAN_ACCESS_TOKEN}")"
          echo "http_code=${result%% *}" >> "${GITHUB_OUTPUT}"
          echo "time_total=${result##* }" >> "${GITHUB_OUTPUT}"

      - name: Write scale result
        if: always()
        shell: bash
        run: |
          mkdir -p scale-results
          cat > "scale-results/service-account-${{ matrix.iteration }}.json" <<JSON
          {
            "iteration": ${{ matrix.iteration }},
            "path": "service-account",
            "resolve_outcome": "${{ steps.resolve.outcome }}",
            "auth_method": "${{ steps.resolve.outputs.auth-method }}",
            "skipped": "${{ steps.resolve.outputs.skipped }}",
            "team_id_resolved": "${{ steps.resolve.outputs.team-id != '' && 'true' || 'false' }}",
            "bearer_me_http_code": "${{ steps.bearer_me.outputs.http_code }}",
            "bearer_me_time_total": "${{ steps.bearer_me.outputs.time_total }}"
          }
          JSON

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scale-service-account-${{ matrix.iteration }}
          path: scale-results/*.json
          if-no-files-found: error

  non-service-baseline-scale:
    name: Non-service PMAK baseline scale ${{ matrix.iteration }}
    needs: scale-gate
    if: needs.scale-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        iteration: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4

      - name: Baseline /me with non-service PMAK
        id: non_service_me
        shell: bash
        env:
          POSTMAN_NON_SERVICE_API_KEY: ${{ secrets.POSTMAN_NON_SERVICE_API_KEY }}
        run: |
          set -euo pipefail
          echo "::add-mask::${POSTMAN_NON_SERVICE_API_KEY}"
          result="$(curl -sS -o /tmp/non-service-me.json -w "%{http_code} %{time_total}" \
            "https://api.getpostman.com/me" \
            -H "x-api-key: ${POSTMAN_NON_SERVICE_API_KEY}")"
          echo "http_code=${result%% *}" >> "${GITHUB_OUTPUT}"
          echo "time_total=${result##* }" >> "${GITHUB_OUTPUT}"

      - id: non_service_exchange
        name: Non-service key exchange negative control
        continue-on-error: true
        uses: shivemind/postman-resolve-service-token-action@dan/validate-cse-pipeline-integration
        with:
          postman-api-key: ${{ secrets.POSTMAN_NON_SERVICE_API_KEY }}

      - name: Write scale result
        if: always()
        shell: bash
        run: |
          mkdir -p scale-results
          cat > "scale-results/non-service-${{ matrix.iteration }}.json" <<JSON
          {
            "iteration": ${{ matrix.iteration }},
            "path": "non-service-pmak",
            "me_http_code": "${{ steps.non_service_me.outputs.http_code }}",
            "me_time_total": "${{ steps.non_service_me.outputs.time_total }}",
            "exchange_outcome": "${{ steps.non_service_exchange.outcome }}"
          }
          JSON

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scale-non-service-${{ matrix.iteration }}
          path: scale-results/*.json
          if-no-files-found: error

  fresh-token-scale:
    name: Fresh token passthrough scale ${{ matrix.iteration }}
    needs: scale-gate
    if: needs.scale-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        iteration: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - id: passthrough
        name: Fresh token passthrough
        continue-on-error: true
        uses: shivemind/postman-resolve-service-token-action@dan/validate-cse-pipeline-integration
        with:
          postman-access-token: ${{ secrets.POSTMAN_FRESH_ACCESS_TOKEN }}

      - name: Write scale result
        if: always()
        shell: bash
        run: |
          mkdir -p scale-results
          cat > "scale-results/fresh-token-${{ matrix.iteration }}.json" <<JSON
          {
            "iteration": ${{ matrix.iteration }},
            "path": "fresh-access-token",
            "passthrough_outcome": "${{ steps.passthrough.outcome }}",
            "skipped": "${{ steps.passthrough.outputs.skipped }}",
            "team_id_resolved": "${{ steps.passthrough.outputs.team-id != '' && 'true' || 'false' }}"
          }
          JSON

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scale-fresh-token-${{ matrix.iteration }}
          path: scale-results/*.json
          if-no-files-found: error
